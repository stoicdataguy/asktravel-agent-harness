[project]
name = "travel-agent"
version = "0.1.0"
description = "Lightweight LangChain ReAct travel agent with memory, served via an OpenAI-compatible API"
readme = "README.md"
authors = [
    { name = "stoicdataguy", email = "akp1596@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fast-flights>=3.1.0",
    "fastapi>=0.162.0",
    "langchain>=1.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.3",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "playwright>=1.64.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
travel-agent = "travel_agent:main"
travel-agent-ingest = "travel_agent.kb.ingest:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
