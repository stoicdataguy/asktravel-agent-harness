# Open WebUI as the chat client (Ollama-style UI). It talks to our FastAPI
# agent through the OpenAI-compatible API at /v1.
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://host.docker.internal:8000/v1
      OPENAI_API_KEY: not-used
      ENABLE_OLLAMA_API: "false"
      WEBUI_AUTH: "false"
      # Sends X-OpenWebUI-Chat-Id / X-OpenWebUI-User-Id headers -> thread_id / user_id
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
volumes:
  open-webui:
